# Watch for a new DGCIS quarterly review.
#
# The state-level layer of the site (states.html) cannot be automated: DGCIS
# publishes a PDF, not an API. So instead of relying on memory, this job
# checks the DGCIS publications page once a month and opens a GitHub issue
# when the newest report changes. You get an email; you update when you want.
#
# The last-seen fingerprint is stored in data/dgcis_seen.txt and committed,
# so the issue is opened once per new publication, not once a month.

name: Watch DGCIS quarterly review

on:
  schedule:
    - cron: "30 3 8 * *"     # 03:30 UTC on the 8th, every month
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the DGCIS publications page
        id: check
        run: python scripts/check_dgcis.py

      - name: Open an issue if a new review has been published
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const found = process.env.FOUND || '(see workflow log)';
            const body = [
              'DGCIS appears to have published a new Quarterly Review of',
              'Merchandise Foreign Trade.',
              '',
              '**Newest report seen:** ' + found,
              '',
              'Source: https://www.dgciskol.gov.in/Publication_QuarterlyReview.aspx',
              '',
              '### What to update',
              '1. Download the new review PDF.',
              '2. Update `data/vc_states.js` — the `quarter`, `districts` and',
              '   `sectors` blocks, and the period labels in `meta`.',
              '3. Update `DGCIS_QUARTER` in `scripts/fetch_data.py` if the',
              '   quarter label changed.',
              '4. Update the period text in the cards on `states.html`.',
              '5. Run `python scripts/build_pages.py` and commit.',
              '',
              '_Opened automatically by the dgcis-watch workflow._'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'New DGCIS quarterly review available',
              body,
              labels: ['data-update']
            });
        env:
          FOUND: ${{ steps.check.outputs.found }}

      - name: Remember what we saw
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "valuechain-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dgcis_seen.txt
          if git diff --cached --quiet; then
            echo "Nothing to record."
          else
            git commit -m "Record newest DGCIS review seen"
            git push
          fi
